name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: python -m pip install -r backend/requirements.txt
      - name: Backend tests with isolated data
        env:
          DATA_DIR: ${{ runner.temp }}/youwu-tests
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t youwu-ci .
      - name: Check fresh container health and setup state
        run: |
          docker run -d --name youwu-ci -p 127.0.0.1:18080:8000 youwu-ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/health
          curl -fsS http://127.0.0.1:18080/api/auth/status | python -c 'import json,sys; d=json.load(sys.stdin); assert not d["initialized"] and not d["authenticated"]'
      - if: always()
        run: docker rm -f youwu-ci || true
